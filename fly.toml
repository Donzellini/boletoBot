app = 'boletos-bot'
primary_region = 'gru'

swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'
  ignorefile = ".dockerignore"

[deploy]
  strategy = "immediate"

[env]
  PORT = "8000"
  WEBHOOK_URL = "https://boletos-bot.fly.dev/webhook"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = 'boletos_data'
  destination = '/data'